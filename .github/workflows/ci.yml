name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # `next build` type-checks the whole project, so this catches broken
      # imports, type errors and route-level mistakes. There is no separate
      # lint step: ESLint is not configured in this repository, and `next lint`
      # was removed in Next 16 (it now reads "lint" as a directory name).
      - name: Build
        run: npm run build
